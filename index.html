<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>
    <style>
        /* Modern and attractive CSS styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #9face6;
        }
        button {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #5b4bc4;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 5px solid #6c5ce7;
            transition: 0.3s;
        }
        /* Completed task style */
        li.completed {
            background: #d4edda;
            border-left-color: #28a745;
            text-decoration: line-through;
            color: #6c757d;
        }
        .delete-btn {
            background: #ff7675;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 6px;
        }
        .delete-btn:hover {
            background: #e15f5f;
        }
    </style>
</head>
<body>
    <h1>JIHAN</h1>
    <div class="container">
        <h2>My Daily Tasks</h2>
        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Add a new task here...">
            <button id="addBtn">Add</button>
        </div>
        <ul id="taskList">
            <!-- Added tasks will appear here dynamically via JavaScript -->
        </ul>
    </div>

    <!-- Smart and interactive JavaScript code -->
    <script>
        // 1. Link UI elements to JavaScript variables
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        // 2. Trigger the add function when clicking the "Add" button
        addBtn.addEventListener('click', addTask);

        // 3. Trigger the add function when pressing the "Enter" key on the keyboard
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // 4. The core function responsible for adding tasks and their interactions
        function addTask() {
            const taskText = taskInput.value.trim();

            // Verify that the user did not leave the input field empty
            if (taskText === "") {
                alert("Please write a task first!");
                return;
            }

            // Create a new list item <li> element
            const li = document.createElement('li');

            // Create the task text span inside
            const taskSpan = document.createElement('span');
            taskSpan.innerText = taskText;
            taskSpan.style.cursor = 'pointer';

            // Toggle the completed style when clicking on the task text
            taskSpan.addEventListener('click', function() {
                li.classList.toggle('completed');
            });

            // Create the delete button for this specific task
            const deleteBtn = document.createElement('button');
            deleteBtn.innerText = "Delete";
            deleteBtn.className = "delete-btn";

            // Remove the task immediately when clicking the delete button
            deleteBtn.addEventListener('click', function() {
                li.remove();
            });

            // Assemble components inside the list item, then add it to the main list
            li.appendChild(taskSpan);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);

            // Clear the input field and refocus after a successful add
            taskInput.value = "";
            taskInput.focus();
        }
    </script>
</body>
</html>
